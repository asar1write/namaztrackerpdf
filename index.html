<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Namaz Tracker - Premium Pill UI</title>
  
  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       BASE, RESET & HIDE SCROLLBARS
       ========================================= */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
       
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0f172a; 
      width: 100vw; min-height: 100vh;
      overflow-x: hidden;
      -ms-overflow-style: none;  
      scrollbar-width: none;  
    }
    body::-webkit-scrollbar, div::-webkit-scrollbar { display: none; }

    /* =========================================
       ROCK-SOLID VIEW ENGINE
       ========================================= */
    .view-section {
      position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
      transition: opacity 0.3s ease-in-out;
    }

    /* =========================================
       HOME VIEW
       ========================================= */
    #homeView {
      z-index: 10; background-color: #f0fdf4;
      display: block; 
      overflow-y: auto; overflow-x: hidden;
      width: 100%; min-height: 100vh;
      opacity: 0; 
    }

    .app-header-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 250px;
      background: linear-gradient(135deg, #022c22, #047857, #10b981);
      border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
      z-index: 1; box-shadow: 0 10px 25px rgba(4, 120, 87, 0.2);
    }

    #inputContainer {
      background: rgba(255, 255, 255, 0.99); padding: 35px 25px; border-radius: 28px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 0 0 1px rgba(16, 185, 129, 0.1);
      width: 90%; max-width: 400px; text-align: center; 
      position: relative; z-index: 5; margin: 120px auto 40px auto; 
    }

    .icon-top {
      width: 55px; height: 55px; background: #ecfdf5; border-radius: 16px; display: flex; justify-content: center; align-items: center;
      margin: 0 auto 15px auto; color: #047857; box-shadow: 0 6px 12px rgba(4, 120, 87, 0.15);
      position: relative; animation: floatIcon 3s ease-in-out infinite alternate;
    }
    @keyframes floatIcon { 0% { transform: translateY(0px); } 100% { transform: translateY(-4px); } }

    .main-heading { font-family: 'Outfit', sans-serif; color: #0f172a; font-size: 1.8em; font-weight: 800; margin-bottom: 5px; }
    .sub-heading { font-family: 'Poppins', sans-serif; color: #64748b; font-size: 0.85em; font-weight: 500; margin-bottom: 25px; line-height: 1.4; }

    .btn-action { 
        position: relative; overflow: hidden;
        background: linear-gradient(135deg, #059669, #10b981); color: #fff; 
        font-family: 'Outfit', sans-serif; padding: 16px 20px; border: none; border-radius: 16px; 
        width: 100%; cursor: pointer; font-weight: 800; font-size: 1.1em;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35); 
        transition: transform 0.1s ease, box-shadow 0.2s ease; 
        display: flex; justify-content: center; align-items: center; gap: 10px; letter-spacing: 0.5px;
    }
    .btn-action:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }

    /* =========================================
       PREVIEW VIEW
       ========================================= */
    #previewView {
      z-index: 20; background: #0f172a; 
      display: none; opacity: 0;
      overflow-y: auto; overflow-x: hidden;
      padding: 85px 10px 140px 10px; min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    .preview-controls {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        width: 92%; max-width: 380px; z-index: 1000; display: flex; justify-content: space-between; gap: 10px;
        background: rgba(30, 41, 59, 0.88); padding: 8px 12px; border-radius: 100px;
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .btn-secondary { 
        font-family: 'Outfit', sans-serif; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.05); 
        padding: 10px 16px; border-radius: 50px; flex: 1; font-weight: 700; font-size: 0.95em; cursor: pointer; transition: background 0.15s ease;
    }
    .btn-secondary:active { background: rgba(255,255,255,0.2); }

    .btn-primary { 
        font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #10b981, #047857); color: #fff; border: none; 
        padding: 10px 16px; border-radius: 50px; flex: 1.5; font-weight: 700; font-size: 0.95em; cursor: pointer;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); display: flex; justify-content: center; align-items: center; gap: 6px;
    }
    .btn-primary:active { transform: scale(0.96); }

    #printArea { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; margin: 0 auto; }
    
    /* =========================================
       SCREEN PREVIEW: A4 STYLING & PILL UI
       ========================================= */
    .page {
        width: 100%; max-width: 750px; aspect-ratio: 1 / 1.4142;
        padding: 15px; background: #fff; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        border-radius: 12px; display: flex; flex-direction: column;
    }

    /* Month Title */
    .month-title {
        text-align: center; font-family: 'Outfit', sans-serif; font-size: 1.2em; font-weight: 800;
        color: #047857; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
    }

    /* Table Reset for Pill Design */
    table { 
        width: 100%; height: 100%; border-collapse: separate; border-spacing: 0 5px; 
        table-layout: fixed; font-family: 'Poppins', sans-serif; text-transform: uppercase;
    }
    
    th, td { text-align: center; font-weight: 700; padding: 2px; vertical-align: middle; border: none; }
    
    /* Pill Headers */
    th { color: #1e293b; font-size: clamp(9px, 2vw, 12px); font-family: 'Outfit', sans-serif; }
    th .pill-header {
        background: #e2e8f0; color: #0f172a; border-radius: 50px; padding: 6px 4px;
        display: block; margin: 0 2px; font-weight: 800; letter-spacing: 0.5px;
    }
    th.primary-col .pill-header { background: #047857; color: #fff; }

    /* Pill Data Cells */
    .pill-date {
        background: #f1f5f9; color: #334155; border-radius: 50px; padding: 5px 8px;
        font-size: clamp(8px, 1.8vw, 11px); font-weight: 800; letter-spacing: 0.5px; display: inline-block; width: 90%;
    }

    .pill-check { 
        width: clamp(14px, 3.5vw, 22px); height: clamp(14px, 3.5vw, 22px); 
        border-radius: 50px; /* Perfect pill/circle shape */
        display: inline-flex; align-items: center; justify-content: center; 
        background: #f8fafc; border: 2px solid #cbd5e1; margin: 0 auto; 
        transition: all 0.2s;
    }
    
    .pill-check.checked { background: #10b981; border-color: #10b981; box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3); }
    .pill-check.completed { background: #059669; border-color: #059669; }

    /* Row highlight if all completed */
    tr.completed-row .pill-date { background: #d1fae5; color: #065f46; }
    tr.completed-row .pill-check { border-color: #059669; }

    /* =========================================
       STRICT PRINT STYLES (PILL UI)
       ========================================= */
    @media print {
        @page { size: A4 portrait; margin: 0; }
        body { background: #fff !important; margin: 0; padding: 0; overflow: visible !important; height: auto !important; width: auto !important; }
        #splashScreen, #homeView, .preview-controls, .custom-toast { display: none !important; }
        #previewView { display: block !important; position: static !important; background: #fff !important; padding: 0 !important; opacity: 1 !important; visibility: visible !important; overflow: visible !important; height: auto !important;}
        #printArea { display: block !important; gap: 0 !important; }
        
        .page { 
            width: 210mm !important; height: 297mm !important; max-width: none !important; aspect-ratio: auto !important; 
            padding: 10mm !important; margin: 0 !important; box-shadow: none !important; border-radius: 0 !important; 
            page-break-after: always !important; page-break-inside: avoid !important; 
        }
        
        table { height: calc(100% - 30px) !important; width: 100% !important; border-spacing: 0 4px !important; }
        
        .month-title { font-size: 18px !important; margin-bottom: 8px !important; }
        th .pill-header { font-size: 12px !important; padding: 6px 2px !important; margin: 0 1px !important; }
        .pill-date { font-size: 11px !important; padding: 5px 4px !important; }
        .pill-check { width: 18px !important; height: 18px !important; border-width: 1.5px !important; }
        
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }

    /* Toast Notification CSS (Hidden for brevity, same as before) */
    .custom-toast {
      position: fixed; top: 20px; left: 50%; transform: translate(-50%, -40px) scale(0.9); background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); color: #fff; padding: 12px 24px; border-radius: 40px; font-size: 0.9em; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); z-index: 10000; display: flex; align-items: center; gap: 8px; width: max-content; max-width: 90vw; opacity: 0; pointer-events: none; transition: transform 0.35s ease, opacity 0.25s ease; border: 1px solid rgba(255,255,255,0.1);
    }
    .custom-toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
    .toast-icon { width: 18px; height: 18px; color: #f87171; }
    .toast-icon.success { color: #34d399; }
    
    /* Splash CSS (Same as before) */
    #splashScreen { position: fixed; inset: 0; background: #011208; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease-out; }
    .splash-glow { position: absolute; width: 350px; height: 350px; background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(1, 18, 8, 0) 70%); border-radius: 50%; animation: pulseGlow 2.5s ease-in-out infinite alternate; }
    @keyframes pulseGlow { 0% { transform: scale(0.85); opacity: 0.6; } 100% { transform: scale(1.15); opacity: 1; } }
    .splash-content { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; width: 100%; padding: 0 20px; }
    .svg-icon-wrapper { width: 110px; height: 110px; margin-bottom: 18px; display: flex; justify-content: center; align-items: center; }
    .splash-title { font-family: 'Outfit', sans-serif; font-size: 1.85em; font-weight: 900; letter-spacing: 3px; margin: 0; padding: 0; text-transform: uppercase; background: linear-gradient(90deg, #FDE047, #ffffff, #FDE047); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; opacity: 1; filter: drop-shadow(0px 0px 10px rgba(253, 224, 71, 0.4)); }
    .splash-subtitle { font-family: 'Poppins', sans-serif; color: #a7f3d0; font-size: 0.75em; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; margin-top:5px; opacity: 1;}
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="custom-toast">
    <svg id="toastIconSvg" class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
    <span id="toastMessage">Error Message</span>
  </div>

  <!-- ROYAL SPLASH SCREEN -->
  <div id="splashScreen">
    <div class="splash-glow"></div>
    <div class="splash-content">
      <div class="svg-icon-wrapper">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%; filter: drop-shadow(0px 10px 20px rgba(253, 224, 71, 0.2));">
          <circle cx="50" cy="50" r="45" stroke="#FDE047" stroke-width="0.8" stroke-dasharray="3 5" fill="none"/>
          <path d="M 50,15 A 35,35 0 1,0 85,50 A 30,30 0 1,1 50,15 Z" stroke="#FDE047" stroke-width="1.5" fill="#FDE047" stroke-linejoin="round"/>
          <path d="M 38 68 C 38 52, 44 48, 50 40 C 56 48, 62 52, 62 68 Z" stroke="#34D399" stroke-width="1.5" fill="#34D399" stroke-linejoin="round"/>
          <path d="M 36 68 L 64 68 Z" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="text-container">
        <h1 class="splash-title">NAMAZ TRACKER</h1>
        <p class="splash-subtitle">PDF GENERATOR</p>
      </div>
    </div>
  </div>

  <!-- HOME VIEW -->
  <div id="homeView" class="view-section">
      <div class="app-header-bg"></div>
      <div id="inputContainer">
        <div class="icon-top">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="12" y2="12"></line><line x1="15" y1="15" x2="12" y2="12"></line>
          </svg>
        </div>
        <h1 class="main-heading">Print Report</h1>
        <p class="sub-heading">Upload your downloaded <br><strong>.json</strong> backup file to generate PDF.</p>
        
        <input type="file" id="jsonFileInput" accept=".json,.txt" style="display: none;" onchange="handleFileSelect(event)">
        
        <button type="button" class="btn-action" onclick="document.getElementById('jsonFileInput').click()">
          UPLOAD .JSON FILE
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>
      </div>
  </div>

  <!-- PREVIEW VIEW -->
  <div id="previewView" class="view-section">
    <div class="preview-controls">
        <button class="btn-secondary" onclick="closePreview()">Cancel</button>
        <button class="btn-primary" onclick="handlePrint()">
            Print File
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
        </button>
    </div>
    <div id="printArea"></div>
  </div>

  <script>
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            const home = document.getElementById('homeView');
            splash.style.opacity = '0';
            home.style.display = 'block';
            void home.offsetWidth; 
            setTimeout(() => { splash.style.display = 'none'; home.style.opacity = '1'; }, 500); 
        }, 1500); 
    });

    let toastTimeout;
    function showToast(message, isSuccess = false) {
        const toast = document.getElementById('toastNotification');
        const toastMsg = document.getElementById('toastMessage');
        const icon = document.getElementById('toastIconSvg');
        toastMsg.innerText = message;
        if (isSuccess) {
            icon.classList.add('success');
            icon.innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
        } else {
            icon.classList.remove('success');
            icon.innerHTML = `<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>`;
        }
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000); 
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            showToast("Processing data...", true);
            setTimeout(() => { processCode(e.target.result); }, 300);
        };
        reader.onerror = function() { showToast("Failed to read the file!"); };
        reader.readAsText(file);
        event.target.value = '';
    }

    function handlePrint() {
        setTimeout(() => {
            try { window.print(); } catch (err) { showToast("Print blocked. Share screen instead."); }
        }, 150);
    }

    const svgCheck = `<svg viewBox="0 0 24 24" width="70%" height="70%" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    const fullMonths = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    const shortMonths = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    // NEW ROBUST DATA EXTRACTOR
    function processCode(rawInput) {
        try {
            let dataString = rawInput.trim();
            // Decode Base64 if needed
            if (!dataString.startsWith('{') && !dataString.startsWith('[')) {
                try { dataString = atob(dataString.replace(/[^A-Za-z0-9+/=]/g, "")); } catch (e) {}
            }
            
            let jsonData = JSON.parse(dataString);
            if (jsonData.data) jsonData = jsonData.data; 
            else if (jsonData.logs) jsonData = jsonData.logs;

            const normalizedData = {}; // Format: { "2023_10": { "1": {f:1, z:0, ...} } }

            const setNamaz = (y, m, d, f, z, a, mag, i) => {
                if (isNaN(y) || isNaN(m) || isNaN(d)) return;
                let key = `${y}_${m}`;
                if (!normalizedData[key]) normalizedData[key] = {};
                normalizedData[key][d] = { 
                    f: !!(f), z: !!(z), a: !!(a), m: !!(mag), i: !!(i) 
                };
            };

            // Loop and Extract Logic
            if (Array.isArray(jsonData)) {
                jsonData.forEach(item => {
                    if (item.date) {
                        let dObj = new Date(item.date);
                        setNamaz(dObj.getFullYear(), dObj.getMonth(), dObj.getDate(), 
                            item.fajr||item.f, item.zuhr||item.dhuhr||item.z||item.d, 
                            item.asr||item.a, item.maghrib||item.m, item.isha||item.i);
                    } else if (item.year !== undefined && item.month !== undefined && item.days) {
                        let daysStr = typeof item.days === 'string' ? item.days : item.days.join('');
                        for (let i = 0; i < daysStr.length; i++) {
                            let val = parseInt(daysStr[i], 36) || 0;
                            setNamaz(item.year, item.month, i + 1, val&1, val&2, val&4, val&8, val&16);
                        }
                    }
                });
            } else if (typeof jsonData === 'object') {
                Object.keys(jsonData).forEach(key => {
                    let val = jsonData[key];
                    let parts = key.split('_');
                    
                    if (parts.length === 2) {
                        let y = parseInt(parts[0]);
                        let m = parseInt(parts[1]);
                        let daysStr = typeof val === 'string' ? val : (Array.isArray(val) ? val.join('') : (val.days ? (Array.isArray(val.days) ? val.days.join('') : val.days) : null));
                        
                        if (typeof daysStr === 'string') {
                            for (let i = 0; i < daysStr.length; i++) {
                                let v = parseInt(daysStr[i], 36) || 0;
                                setNamaz(y, m, i + 1, v&1, v&2, v&4, v&8, v&16);
                            }
                        }
                    }
                });
            }

            const sortedKeys = Object.keys(normalizedData).sort((a, b) => {
                const [yearA, monthA] = a.split('_').map(Number);
                const [yearB, monthB] = b.split('_').map(Number);
                return yearA !== yearB ? yearA - yearB : monthA - monthB;
            });

            if (sortedKeys.length === 0) { 
                showToast("No proper Namaz tracker data found in file."); return; 
            }

            // Generate UI
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';
            
            sortedKeys.forEach((key) => {
                const [year, monthIndex] = key.split('_').map(Number);
                const monthData = normalizedData[key];
                const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
                
                const page = document.createElement('div');
                page.className = 'page';
                
                // Add Month Title
                const monthTitle = document.createElement('div');
                monthTitle.className = 'month-title';
                monthTitle.innerText = `${fullMonths[monthIndex]} ${year}`;
                page.appendChild(monthTitle);

                const table = document.createElement('table');
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th class="primary-col" style="width:25%;"><span class="pill-header">DATE</span></th>
                            <th style="width:15%;"><span class="pill-header">फज्र</span></th>
                            <th style="width:15%;"><span class="pill-header">जुहर</span></th>
                            <th style="width:15%;"><span class="pill-header">असर</span></th>
                            <th style="width:15%;"><span class="pill-header">मगरिब</span></th>
                            <th style="width:15%;"><span class="pill-header">ईशा</span></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;
                const tbody = table.querySelector('tbody');
                
                for (let day = 1; day <= daysInMonth; day++) {
                    const dd = String(day).padStart(2, '0');
                    const formattedDate = `${dd} ${shortMonths[monthIndex]}`;
                    
                    let dayData = monthData[day] || { f:false, z:false, a:false, m:false, i:false };
                    const allCompleted = dayData.f && dayData.z && dayData.a && dayData.m && dayData.i;
                    
                    const row = document.createElement('tr');
                    if (allCompleted) row.className = 'completed-row';
                    
                    const createPillBox = (isChecked) => {
                        const c = isChecked ? (allCompleted ? 'pill-check completed' : 'pill-check checked') : 'pill-check';
                        return `<div class="${c}">${isChecked ? svgCheck : ''}</div>`;
                    };

                    row.innerHTML = `
                        <td><div class="pill-date">${formattedDate}</div></td>
                        <td>${createPillBox(dayData.f)}</td>
                        <td>${createPillBox(dayData.z)}</td>
                        <td>${createPillBox(dayData.a)}</td>
                        <td>${createPillBox(dayData.m)}</td>
                        <td>${createPillBox(dayData.i)}</td>
                    `;
                    tbody.appendChild(row);
                }
                page.appendChild(table);
                printArea.appendChild(page);
            });

            document.getElementById('homeView').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('homeView').style.display = 'none';
                const pView = document.getElementById('previewView');
                pView.style.display = 'block';
                void pView.offsetWidth; 
                pView.scrollTop = 0;
                pView.style.opacity = '1';
                showToast("PDF Preview Ready!", true);
            }, 300); 

        } catch (err) {
            console.error("Parse Error:", err);
            showToast("Invalid data structure in JSON.");
        }
    }

    function closePreview() {
        const pView = document.getElementById('previewView');
        const hView = document.getElementById('homeView');
        pView.style.opacity = '0';
        setTimeout(() => {
            pView.style.display = 'none';
            hView.style.display = 'block';
            void hView.offsetWidth; 
            hView.style.opacity = '1';
        }, 300);
    }
  </script>
</body>
</html>
